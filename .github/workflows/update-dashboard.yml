name: Update dashboard

on:
  schedule:
    # 12:00 UTC = 6:00am Mountain (MDT, UTC-6) / 5:00am (MST, UTC-7)
    - cron: "0 12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::flexdashboard
            any::plotly
            any::dataRetrieval
            any::snotelr
            any::tidyverse
            any::lubridate

      - name: Render dashboard
        run: Rscript -e 'rmarkdown::render("dashboard.Rmd", output_file = "index.html", output_dir = "docs")'

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Auto-update dashboard $(date -u +%Y-%m-%d)"
          git push
