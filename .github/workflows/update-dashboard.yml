name: Update dashboard

on:
  schedule:
    # 12:00 UTC = 6:00am Mountain (MDT, UTC-6) / 5:00am (MST, UTC-7)
    - cron: "0 12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::flexdashboard
            any::plotly
            any::dataRetrieval
            any::snotelr
            any::tidyverse
            any::lubridate

      - name: Render dashboard
        run: Rscript -e 'rmarkdown::render("dashboard.Rmd", output_file = "index.html", output_dir = "docs")'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
